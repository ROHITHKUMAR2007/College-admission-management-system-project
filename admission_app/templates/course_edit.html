{% extends "base.html" %}
{% from "_macros.html" import course_fields %}
{% block title %}Edit course – Admission Office{% endblock %}
{% block content %}
<h1>Edit course</h1>
<section class="panel">
  <form method="post" class="grid">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    {{ course_fields(form) }}
    <div class="row"><button class="btn">Save changes</button><a href="{{ url_for('courses') }}">Cancel</a></div>
  </form>
</section>
{% endblock %}
